# Compose dedicado ao lado do CLIENT (executar na máquina Windows).
# Sobe APENAS o client em container, conectando-se ao broker remoto (Linux).
#
# Uso (a partir da raiz do repositório, no Windows):
#   docker compose -f docker-compose.client.yml build
#   docker compose -f docker-compose.client.yml run --rm client
#
# Use `run --rm` (não `up`) porque o client é interativo (menu via Console.ReadLine).
# Se preferir `up`, use `docker attach rabbitmq_rpc_client` para interagir.

services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: rabbitmq_rpc_client:latest
    container_name: rabbitmq_rpc_client
    stdin_open: true   # mantém STDIN aberto (interativo)
    tty: true          # aloca TTY para o menu do client
    environment:
      # Broker remoto (Linux)
      - RabbitMQ_HOST=${RabbitMQ_HOST:-200.235.92.106}
      - RabbitMQ_PORT=${RabbitMQ_PORT:-5672}
      - RabbitMQ_USER=${RabbitMQ_USER:-guest}
      - RabbitMQ_PASS=${RabbitMQ_PASS:-guest}
      - RabbitMQ_VHOST=${RabbitMQ_VHOST:-/}
      - QUEUE_RPC=${QUEUE_RPC:-fila_rpc}
      - QUEUE_ASYNC=${QUEUE_ASYNC:-fila_async}
      - RPC_TIMEOUT=${RPC_TIMEOUT:-10000}
    # Sem network_mode: host (incompatível com Docker Desktop/Windows).
    # Bridge padrão funciona: o container faz NAT pelo Docker Desktop e
    # alcança o broker remoto exatamente como o host alcança.
